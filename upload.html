<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>העלאת מסמך — טן ג'ובס</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --ink:#1d2433; --mut:#5b6576; --acc:#1f5fbf; --ok:#1d7a3a; --err:#b42318; --line:#dde3ea; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI",Arial,sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  .langs { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:12px; }
  .langs button { border:1px solid var(--line); background:#fff; border-radius:20px; padding:6px 12px; font-size:14px; cursor:pointer; }
  .langs button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size:21px; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:14px; margin-bottom:16px; }
  .doc { background:#eef3fb; border-radius:10px; padding:12px 14px; font-size:17px; font-weight:600; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input[type=file] { width:100%; padding:12px; border:2px dashed var(--line); border-radius:10px; background:#fafbfc; font-size:15px; }
  textarea { width:100%; min-height:64px; padding:10px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  .hint { color:var(--mut); font-size:13px; margin-top:6px; }
  button.send { width:100%; margin-top:18px; padding:14px; font-size:17px; font-weight:700; border:0; border-radius:10px; background:var(--acc); color:#fff; cursor:pointer; }
  button.send:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:14px; padding:12px; border-radius:10px; font-weight:600; display:none; }
  .msg.ok { display:block; background:#e7f6ec; color:var(--ok); }
  .msg.err { display:block; background:#fdecea; color:var(--err); }
  .bad { text-align:center; color:var(--err); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="langs" id="langs"></div>
  <div class="card" id="card">
    <h1 data-t="title"></h1>
    <div class="sub" data-t="sub"></div>
    <div class="doc" id="docBox"></div>
    <label for="files" data-t="pick"></label>
    <input type="file" id="files" accept="image/*,application/pdf" multiple>
    <div class="hint" data-t="hint"></div>
    <label for="note" data-t="noteL"></label>
    <textarea id="note" maxlength="300"></textarea>
    <button class="send" id="send" data-t="send"></button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
/* 10/10/2026 — העלאת מסמך שמרכז הבקשות ביקש מהעובד (כפתור "📎 בקש מסמך").
   קישור: upload.html?ref=TJ-…&emp=0338&doc=visa  (doc=other&t=<תיאור> למסמך חופשי)
   הקבצים נשלחים ל-Apps Script (kind: docUpload) ונקלטים למרכז הבקשות בתוך כ-10 דקות. */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzw4Pq6XiaaO2U7ZGrIWySljXhpyQIbKAnTppSNRHIQFVsAQZ9ddQJnbMK8y7z0fXfs/exec';
const LANGS = { he: "עברית", en: "English", ti: "ትግርኛ", ru: "Русский", ar: "العربية" };
const T = {
  he: { title: "העלאת מסמך", sub: "טן ג'ובס ביקשה ממך את המסמך הבא:", pick: "צלמו או בחרו קובץ (אפשר כמה)", hint: "תמונה או PDF. צלמו ישר, ברור ובלי השתקפות.", noteL: "הערה (לא חובה)", send: "שליחה", sending: "שולח…", ok: "✅ המסמך התקבל. תודה!", none: "יש לבחור לפחות קובץ אחד", fail: "השליחה נכשלה. נסו שוב או שלחו את התמונה בוואטסאפ.", bad: "הקישור לא תקין. בקשו קישור חדש.",
        visa: "ויזה / רישיון ישיבה בתוקף", passport: "דרכון (עמוד התמונה)", id: "תעודת זהות + ספח", bank: "אישור ניהול חשבון בנק", medical: "אישור רפואי", other: "מסמך" },
  en: { title: "Upload a document", sub: "Ten Jobs has asked you for the following document:", pick: "Take a photo or choose a file (several allowed)", hint: "Photo or PDF. Shoot straight, clear, without glare.", noteL: "Note (optional)", send: "Send", sending: "Sending…", ok: "✅ Document received. Thank you!", none: "Please choose at least one file", fail: "Sending failed. Try again or send the photo on WhatsApp.", bad: "Invalid link. Please ask for a new one.",
        visa: "Valid visa / residence permit", passport: "Passport (photo page)", id: "ID card + appendix", bank: "Bank account confirmation", medical: "Medical certificate", other: "Document" },
  ti: { title: "ሰነድ ምልኣኽ", sub: "ቴን ጆብስ እዚ ዝስዕብ ሰነድ ሓቲቱኩም ኣሎ:", pick: "ስእሊ ኣልዕሉ ወይ ፋይል ምረጹ", hint: "ስእሊ ወይ PDF። ንጹርን ብዘይ ብርሃን ነጸብራቕን።", noteL: "መዘኻኸሪ (ግዴታ ኣይኮነን)", send: "ስደድ", sending: "ይለኣኽ ኣሎ…", ok: "✅ ሰነድ በጺሑ። የቐንየልና!", none: "እንተወሓደ ሓደ ፋይል ምረጹ", fail: "ምልኣኽ ኣይተዓወተን። እንደገና ፈትኑ ወይ ብዋትስኣፕ ስደዱ።", bad: "ዘይቅኑዕ ሊንክ። ሓድሽ ሕተቱ።",
        visa: "ብግቡእ ዝሰርሕ ቪዛ / ፍቓድ መንበሪ", passport: "ፓስፖርት (ገጽ ስእሊ)", id: "መንነት + ተወሳኺ", bank: "ምስክር ሕሳብ ባንኪ", medical: "ሕክምናዊ ምስክር", other: "ሰነድ" },
  ru: { title: "Загрузка документа", sub: "Ten Jobs просит вас прислать документ:", pick: "Сфотографируйте или выберите файл (можно несколько)", hint: "Фото или PDF. Снимайте прямо, чётко, без бликов.", noteL: "Примечание (необязательно)", send: "Отправить", sending: "Отправка…", ok: "✅ Документ получен. Спасибо!", none: "Выберите хотя бы один файл", fail: "Не удалось отправить. Попробуйте снова или пришлите фото в WhatsApp.", bad: "Неверная ссылка. Попросите новую.",
        visa: "Действующая виза / разрешение на пребывание", passport: "Паспорт (страница с фото)", id: "Удостоверение личности + приложение", bank: "Подтверждение банковского счёта", medical: "Медицинская справка", other: "Документ" },
  ar: { title: "رفع مستند", sub: "طلبت منك تن جوبس المستند التالي:", pick: "صوّر أو اختر ملفاً (يمكن عدة ملفات)", hint: "صورة أو PDF. صوّر بشكل مستقيم وواضح وبدون انعكاس.", noteL: "ملاحظة (اختياري)", send: "إرسال", sending: "جارٍ الإرسال…", ok: "✅ تم استلام المستند. شكراً!", none: "يرجى اختيار ملف واحد على الأقل", fail: "فشل الإرسال. حاول مرة أخرى أو أرسل الصورة عبر واتساب.", bad: "رابط غير صالح. اطلب رابطاً جديداً.",
        visa: "تأشيرة / تصريح إقامة ساري", passport: "جواز السفر (صفحة الصورة)", id: "بطاقة الهوية + الملحق", bank: "تأكيد حساب بنكي", medical: "شهادة طبية", other: "مستند" }
};
const P = new URLSearchParams(location.search);
const REF = (P.get("ref") || "").trim(), EMP = (P.get("emp") || "").trim(), DOC = (P.get("doc") || "").trim(), FREE = (P.get("t") || "").trim().slice(0, 80);
const DOCS = ["visa", "passport", "id", "bank", "medical", "other"];
const valid = /^TJ-\d{6}-\d{3}$/.test(REF) && DOCS.includes(DOC);
let lang = T[P.get("lang")] ? P.get("lang") : "he";
const $ = id => document.getElementById(id);

function docLabel(l) { return DOC === "other" && FREE ? FREE : T[l][DOC]; }
function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "he" || lang === "ar") ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T[lang][e.dataset.t]; });
  $("langs").innerHTML = Object.keys(LANGS).map(k => `<button class="${k === lang ? "on" : ""}" data-l="${k}">${LANGS[k]}</button>`).join("");
  if (!valid) { $("card").innerHTML = `<p class="bad">${T[lang].bad}</p>`; return; }
  $("docBox").textContent = "📎 " + docLabel(lang);
}
$("langs").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) { lang = b.dataset.l; render(); } });

/* תמונה מהטלפון (לרוב 3–8MB) מוקטנת ל-2000px ‏JPEG — מספיק לקריאה, ושולח מהר */
function readAsDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
async function prepare(file) {
  if (file.type === "application/pdf") {
    if (file.size > 8 * 1024 * 1024) throw new Error("PDF > 8MB");
    return { name: file.name, data: await readAsDataURL(file) };
  }
  if (!/^image\//.test(file.type)) throw new Error("type");
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return { name: file.name.replace(/\.[^.]+$/, "") + ".jpg", data: c.toDataURL("image/jpeg", 0.85) };
  } finally { URL.revokeObjectURL(url); }
}
async function send() {
  const msg = $("msg"); msg.className = "msg";
  const files = Array.from($("files").files || []).slice(0, 5);
  if (!files.length) { msg.className = "msg err"; msg.textContent = T[lang].none; return; }
  const btn = $("send"); btn.disabled = true; btn.textContent = T[lang].sending;
  try {
    const prepared = [];
    for (const f of files) prepared.push(await prepare(f));
    const r = await fetch(APPS_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow",
      body: JSON.stringify({ kind: "docUpload", ref: REF, emp: EMP, doc: docLabel("he"), note: $("note").value.trim(), files: prepared }) });
    const j = await r.json();
    if (!j.success) throw new Error(j.message || "fail");
    $("card").innerHTML = `<div class="msg ok" style="display:block">${T[lang].ok}</div>`;
  } catch (e) {
    msg.className = "msg err"; msg.textContent = T[lang].fail;
    btn.disabled = false; btn.textContent = T[lang].send;
  }
}
$("send") && $("send").addEventListener("click", send);
render();
</script>
</body>
</html>
